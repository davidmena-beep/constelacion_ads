<!--
  Index.html — Carcasa de la Web App · Versión 1.2.0 (2026-10-01)
  v1.2.0: conexión por fetch (API_URL) para publicar fuera de Apps Script (GitHub + Bolt); dentro de Apps Script funciona igual que antes.
  v1.1.0: importación de evaluaciones desde Excel (una hoja, con detección de fórmulas de ponderación) · inicio con logo y textos ADS + ojo de clave · carga por lista en Catálogos y Usuarios.
  v1.0.0: versión inicial.
  Archivo único: HTML + CSS + JS (no requiere Styles.html ni Script.html; Code.gs sigue igual).
  Backend sin cambios: Code.gs · Api.gs · Motor.gs · Db.gs · Esquema.gs · Setup.gs · Seed.gs

<html lang="es">
<head>
  <base target="_top">
  <script src="/config.js"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Evaluaciones · Talento Humano</title>
  <meta name="app-version" content="1.2.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
/* ==========================================================================
   Styles.html — Sistema de diseño "Cielo del Sur"
   Mobile-first. Tokens → base → layout → componentes → flujo de test → gráficos.
   Para aplicar la marca corporativa basta con cambiar los tokens de :root.
   ========================================================================== */

:root {
  /* Superficies y tinta */
  --bg: #edf1f4;  --surface: #ffffff;  --surface-2: #f4f7f9;
  --ink: #0e2837; --ink-2: #47606f;    --ink-3: #6b8190;
  --line: #d7e0e6; --line-2: #e7edf1;
  /* Marca: Pacífico (acción) y Estrella (logro; se usa solo para "encendido/completado") */
  --pri: #0a6b7d;  --pri-strong: #074f5d;  --pri-ink: #ffffff;  --pri-soft: #d9eef2;
  --star: #f2b632; --star-soft: #fff1cc;
  /* Cielo: paneles oscuros fijos (hero, login, resultado) */
  --sky: #0c2233;  --sky-2: #163750;  --sky-ink: #e9f1f6;  --sky-dim: #8fa8b9;
  /* Estados (siempre con icono/etiqueta, nunca solo color) */
  --ok: #1e8e5a;   --ok-soft: #ddf3e8;   --warn: #8a5a00;  --warn-soft: #fff0cc;
  --bad: #b42318;  --bad-soft: #fde4e1;
  /* Serie categórica validada (orden fijo, sin ciclar): azul · naranja · aqua · amarillo */
  --s1: #2a78d6;   --s2: #eb6834;   --s3: #1baf7a;   --s4: #eda100;
  /* Forma */
  --r-sm: 8px; --r-md: 12px; --r-lg: 20px;
  --sh: 0 1px 2px rgba(14,40,55,.06), 0 6px 20px rgba(14,40,55,.06);
  --focus: 0 0 0 3px rgba(10,107,125,.35);
  /* Tipografía */
  --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --nav-h: 64px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0a1720; --surface: #10222e; --surface-2: #0c1d28;
    --ink: #e6eff4; --ink-2: #a6bbc8; --ink-3: #7d94a3;
    --line: #25404f; --line-2: #1b3240;
    --pri: #3cb7cc; --pri-strong: #6fd0e0; --pri-ink: #06242b; --pri-soft: #12404a;
    --star-soft: #3a2f10;
    --ok: #46c08a; --ok-soft: #12382a; --warn: #f0b94f; --warn-soft: #3a2d0e; --bad: #ff8a7c; --bad-soft: #42201b;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
    --sh: 0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.3);
    --focus: 0 0 0 3px rgba(60,183,204,.45);
  }
}

/* ───────── base ───────── */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 16px/1.5 var(--f-body); font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
h1, h2, h3, h4, p { margin: 0; }
h1, h2 { font-family: var(--f-display); letter-spacing: -.02em; font-weight: 700; line-height: 1.12; }
h1 { font-size: clamp(26px, 6vw, 34px); }
h2 { font-size: 21px; }
h3 { font-size: 16px; font-weight: 650; line-height: 1.3; }
small, .small { font-size: 13.5px; }
.muted { color: var(--ink-2); }
.faint { color: var(--ink-3); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: none; box-shadow: var(--focus); border-radius: var(--r-sm); }
[hidden] { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
svg { display: block; }
.ico { width: 22px; height: 22px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* ───────── layout de la app ───────── */
#app { min-height: 100dvh; }
.shell { display: flex; flex-direction: column; min-height: 100dvh; }
.topbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line-2); }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--f-display); font-weight: 700; letter-spacing: -.01em; line-height: 1.1; }
.brand svg { width: 30px; height: 30px; }
.brand small { display: block; font-family: var(--f-body); font-weight: 500; color: var(--ink-2); font-size: 12px; letter-spacing: 0; }
.topbar .sp { flex: 1; }
.userchip { display: flex; align-items: center; gap: 10px; background: none; border: 0; padding: 4px; border-radius: 999px; }
.avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--sky); color: var(--star); display: grid; place-items: center; font: 700 14px var(--f-display); }
.userchip .who { display: none; text-align: left; line-height: 1.2; }
.main { flex: 1; width: 100%; max-width: 1120px; margin: 0 auto; padding: 20px 16px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom)); }
.nav { position: fixed; z-index: 30; left: 0; right: 0; bottom: 0; display: flex; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
.nav button { flex: 1; min-height: var(--nav-h); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; background: none; border: 0; color: var(--ink-3); font-size: 12px; font-weight: 600; position: relative; }
.nav button[aria-current="page"] { color: var(--pri); }
.nav button[aria-current="page"]::before { content: ""; position: absolute; top: 0; left: 28%; right: 28%; height: 3px; border-radius: 0 0 3px 3px; background: var(--pri); }
.view-head { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px 16px; margin-bottom: 20px; }
.view-head .sp { flex: 1; }
.view-head p { color: var(--ink-2); margin-top: 4px; max-width: 62ch; }
.stack { display: grid; gap: 28px; }
.stack-sm { display: grid; gap: 12px; }
.row-flex { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

@media (min-width: 960px) {
  .shell { flex-direction: row; }
  .topbar { display: none; }
  .nav { position: sticky; top: 0; align-self: flex-start; flex-direction: column; width: 244px; height: 100dvh; padding: 22px 14px; border: 0; border-right: 1px solid var(--line); gap: 4px; background: var(--surface); }
  .nav .brand { padding: 4px 10px 22px; }
  .nav button { flex: none; flex-direction: row; justify-content: flex-start; gap: 12px; min-height: 46px; padding: 0 12px; border-radius: var(--r-md); font-size: 15px; }
  .nav button[aria-current="page"] { background: var(--pri-soft); color: var(--pri-strong); }
  .nav button[aria-current="page"]::before { display: none; }
  .nav .foot { margin-top: auto; padding: 10px; border-top: 1px solid var(--line-2); display: grid; gap: 8px; }
  .main { padding: 36px 40px 56px; }
  .userchip .who { display: block; }
}
.nav .brand, .nav .foot { display: none; }
@media (min-width: 960px) { .nav .brand { display: flex; } .nav .foot { display: grid; } }

/* ───────── controles ───────── */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 18px; border-radius: var(--r-md); border: 1px solid var(--line); background: var(--surface); font-weight: 650; text-decoration: none; transition: background .15s, border-color .15s, transform .05s; }
.btn:hover { background: var(--surface-2); border-color: var(--ink-3); }
.btn:active { transform: translateY(1px); }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.btn-pri { background: var(--pri); border-color: var(--pri); color: var(--pri-ink); }
.btn-pri:hover { background: var(--pri-strong); border-color: var(--pri-strong); }
.btn-quiet { background: none; border-color: transparent; color: var(--pri); padding: 0 10px; }
.btn-quiet:hover { background: var(--pri-soft); border-color: transparent; }
.btn-bad { color: var(--bad); }
.btn-sm { min-height: 36px; padding: 0 12px; font-size: 14px; }
.btn-block { width: 100%; }
.field { display: grid; gap: 6px; }
.field > label, .field > .lbl { font-size: 13.5px; font-weight: 650; color: var(--ink-2); }
.input, select.input, textarea.input { width: 100%; min-height: 44px; padding: 10px 12px; border-radius: var(--r-md); border: 1px solid var(--line); background: var(--surface); }
textarea.input { min-height: 88px; resize: vertical; line-height: 1.45; }
.input:focus { outline: none; border-color: var(--pri); box-shadow: var(--focus); }
.input[readonly], .input.auto { background: var(--surface-2); color: var(--ink-2); }
.input::placeholder { color: var(--ink-3); font-style: italic; }
.form-grid { display: grid; gap: 14px; }
@media (min-width: 640px) { .form-grid.two { grid-template-columns: 1fr 1fr; } .form-grid .full { grid-column: 1 / -1; } }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 12.5px; font-weight: 650; background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line-2); white-space: nowrap; }
.pill.ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.pill.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.pill.bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.pill.star { background: var(--star-soft); color: var(--warn); border-color: transparent; }
.tabs { display: inline-flex; gap: 4px; padding: 4px; background: var(--surface-2); border: 1px solid var(--line-2); border-radius: var(--r-md); }
.tabs button { min-height: 38px; padding: 0 16px; border: 0; background: none; border-radius: 9px; font-weight: 650; color: var(--ink-2); }
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--sh); }
.switch { position: relative; width: 46px; height: 28px; flex: none; border-radius: 999px; border: 0; background: var(--line); transition: background .15s; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: transform .15s; box-shadow: 0 1px 3px rgba(0,0,0,.3); }
.switch[aria-checked="true"] { background: var(--ok); }
.switch[aria-checked="true"]::after { transform: translateX(18px); }
.alert { padding: 12px 14px; border-radius: var(--r-md); background: var(--warn-soft); color: var(--warn); font-size: 14.5px; }
.alert.bad { background: var(--bad-soft); color: var(--bad); }
.alert ul { margin: 6px 0 0; padding-left: 18px; }
.empty { padding: 36px 16px; text-align: center; color: var(--ink-2); border: 1px dashed var(--line); border-radius: var(--r-lg); }
.empty strong { display: block; color: var(--ink); margin-bottom: 4px; }
.spinner { width: 22px; height: 22px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--pri); animation: spin .8s linear infinite; }
.loading { display: flex; gap: 12px; align-items: center; justify-content: center; padding: 60px 0; color: var(--ink-2); }
@keyframes spin { to { transform: rotate(360deg); } }

/* ───────── paneles y listas ───────── */
.panel { background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--r-lg); padding: 18px; box-shadow: var(--sh); }
.panel > h3:first-child, .panel > .ph { margin-bottom: 14px; }
.ph { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.sect-title { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.sect-title span { color: var(--ink-2); font-size: 14px; }
.list { display: grid; }
.li { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; padding: 14px 4px; border-top: 1px solid var(--line-2); }
.li:first-child { border-top: 0; }
.li .t { font-weight: 650; }
.li .d { color: var(--ink-2); font-size: 14px; grid-column: 1 / -1; }
.li .acts { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }

/* ───────── hero "cielo" (constelación personal) ───────── */
.sky { position: relative; overflow: hidden; border-radius: var(--r-lg); background: radial-gradient(120% 140% at 85% -10%, var(--sky-2) 0%, var(--sky) 62%); color: var(--sky-ink); padding: 22px 20px 12px; }
.sky h1 { color: #fff; }
.sky p { color: var(--sky-dim); }
.sky-grid { display: grid; gap: 4px; }
.constel { width: 100%; max-width: 520px; margin: 6px auto 0; height: auto; overflow: visible; }
.constel .ln { stroke: var(--sky-dim); stroke-opacity: .35; stroke-width: 1.2; stroke-dasharray: 3 5; }
.constel .ln.on { stroke: var(--star); stroke-opacity: .85; stroke-dasharray: none; stroke-width: 1.6; }
.constel .st { cursor: pointer; }
.constel .st:focus-visible { outline: none; }
.constel .st:focus-visible .ring { stroke: #fff; stroke-width: 2; }
.constel .core { fill: var(--sky); stroke: var(--sky-dim); stroke-width: 1.5; }
.constel .on .core { fill: var(--star); stroke: var(--star); }
.constel .halo { fill: var(--star); opacity: 0; }
.constel .on .halo { opacity: .22; }
.constel .ring { fill: none; stroke: transparent; }
.constel text { fill: var(--sky-dim); font: 600 12px var(--f-body); text-anchor: middle; }
.constel .on text { fill: var(--sky-ink); }
.sky-foot { color: var(--sky-dim); font-size: 13px; padding: 4px 0 6px; }
@media (min-width: 760px) {
  .sky { padding: 30px 36px 22px; }
  .sky-grid { grid-template-columns: 1fr 1.25fr; align-items: center; gap: 24px; }
  .constel { margin: 0; }
}
@media (prefers-reduced-motion: no-preference) {
  .constel .on .halo { animation: twinkle 3.6s ease-in-out infinite; }
  @keyframes twinkle { 0%, 100% { opacity: .18; } 50% { opacity: .34; } }
}

/* ───────── tarjetas de evaluación ───────── */
.ev-grid { display: grid; gap: 12px; }
@media (min-width: 720px) { .ev-grid { grid-template-columns: 1fr 1fr; } }
.ev { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; padding: 16px; border-radius: var(--r-lg); border: 1px solid var(--line-2); background: var(--surface); box-shadow: var(--sh); align-content: start; }
.ev .badge { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; background: var(--surface-2); color: var(--ink-2); font: 700 17px var(--f-display); border: 1px solid var(--line-2); }
.ev.done .badge { background: var(--star-soft); color: var(--warn); border-color: transparent; }
.ev .badge svg { width: 22px; height: 22px; fill: currentColor; stroke: none; }
.ev h3 { margin-top: 1px; }
.ev .desc { color: var(--ink-2); font-size: 14.5px; grid-column: 2; }
.ev .res { grid-column: 2; margin-top: 4px; }
.ev .acts { grid-column: 2; display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }

/* ───────── perfil (tabla adaptable) ───────── */
.perfil { display: grid; }
.perfil .pr { display: grid; gap: 2px 16px; padding: 14px 2px; border-top: 1px solid var(--line-2); }
.perfil .pr:first-child { border-top: 0; }
.perfil .pr .h { font-size: 13.5px; color: var(--ink-2); font-weight: 600; }
.perfil .pr .r { font: 700 19px var(--f-display); letter-spacing: -.01em; }
.perfil .pr .dt { color: var(--ink-2); font-size: 14px; }
@media (min-width: 760px) { .perfil .pr { grid-template-columns: 240px 1fr 1.3fr; align-items: baseline; } .perfil .pr .r { font-size: 18px; } }

/* ───────── flujo del test (pantalla completa) ───────── */
.flow { position: fixed; inset: 0; z-index: 50; background: var(--bg); display: flex; flex-direction: column; }
.flow-head { padding: 10px 16px 12px; background: var(--surface); border-bottom: 1px solid var(--line-2); }
.flow-top { display: flex; align-items: center; gap: 10px; max-width: 760px; margin: 0 auto; }
.flow-top h2 { font-size: 17px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.iconbtn { width: 44px; height: 44px; border-radius: 50%; border: 0; background: none; display: grid; place-items: center; color: var(--ink-2); }
.iconbtn:hover { background: var(--surface-2); }
.prog { max-width: 760px; margin: 6px auto 0; display: grid; gap: 6px; }
.prog .bar { height: 6px; border-radius: 6px; background: var(--line-2); overflow: hidden; }
.prog .bar i { display: block; height: 100%; background: var(--pri); border-radius: 6px; transition: width .25s; }
.prog .meta { display: flex; justify-content: space-between; font-size: 13px; color: var(--ink-2); }
.flow-body { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 20px 16px 28px; }
.flow-in { max-width: 760px; margin: 0 auto; display: grid; gap: 16px; }
.flow-foot { padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); background: var(--surface); border-top: 1px solid var(--line-2); }
.flow-foot .in { max-width: 760px; margin: 0 auto; display: flex; gap: 10px; align-items: center; }
.flow-foot .hint { flex: 1; font-size: 13.5px; color: var(--ink-2); }
.intro { display: grid; gap: 14px; }
.intro .lead { font-size: 17px; line-height: 1.55; }
.note { font-size: 13.5px; color: var(--ink-2); padding: 12px 14px; background: var(--surface-2); border-radius: var(--r-md); border: 1px solid var(--line-2); }
.qhead { display: flex; gap: 10px; align-items: baseline; }
.qhead h2 { font-size: 19px; }
.q { display: grid; gap: 12px; padding: 16px; background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--r-lg); }
.q.miss { border-color: var(--warn); }
.q .qt { display: flex; gap: 10px; }
.q .qn { color: var(--ink-3); font-weight: 650; min-width: 1.6em; }
.q .qx { font-weight: 550; }
.scale { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 8px; }
.scale button { min-height: 52px; border-radius: var(--r-md); border: 1.5px solid var(--line); background: var(--surface); font: 700 18px var(--f-display); color: var(--ink); transition: background .12s, border-color .12s, color .12s; }
.scale button:hover { border-color: var(--pri); }
.scale button[aria-checked="true"] { background: var(--pri); border-color: var(--pri); color: var(--pri-ink); }
.scale-ends { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--ink-3); margin-top: -4px; }
.scale.disc { grid-auto-flow: row; grid-template-columns: 1fr 1fr; }
.scale.disc button { display: flex; align-items: center; gap: 10px; padding: 8px 12px; text-align: left; font: 600 14px var(--f-body); min-height: 54px; }
.scale.disc button b { font: 700 20px var(--f-display); min-width: 1.1em; }
@media (min-width: 640px) { .scale.disc { grid-auto-flow: column; grid-template-columns: none; grid-auto-columns: 1fr; } }
.opts { display: grid; gap: 10px; }
.opt { display: flex; gap: 12px; align-items: flex-start; text-align: left; padding: 14px; border-radius: var(--r-md); border: 1.5px solid var(--line); background: var(--surface); min-height: 54px; transition: border-color .12s, background .12s; }
.opt:hover { border-color: var(--pri); }
.opt .k { flex: none; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font: 700 13px var(--f-body); background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line); text-transform: uppercase; }
.opt[aria-checked="true"] { border-color: var(--pri); background: var(--pri-soft); }
.opt[aria-checked="true"] .k { background: var(--pri); color: var(--pri-ink); border-color: var(--pri); }
.opts.ab { grid-template-columns: 1fr; }
@media (min-width: 640px) { .opts.ab { grid-template-columns: 1fr 1fr; } }
.situ { padding: 18px; border-radius: var(--r-lg); background: var(--sky); color: var(--sky-ink); font-size: 17px; line-height: 1.55; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--surface); font-weight: 600; transition: background .12s, border-color .12s; }
.chip:hover { border-color: var(--pri); }
.chip[aria-pressed="true"] { background: var(--pri); border-color: var(--pri); color: var(--pri-ink); }
.counter { position: sticky; top: -20px; z-index: 2; display: flex; align-items: center; gap: 12px; padding: 10px 14px; margin: -4px 0 0; border-radius: var(--r-md); background: var(--surface); border: 1px solid var(--line); box-shadow: var(--sh); }
.counter b { font: 700 22px var(--f-display); }

}
