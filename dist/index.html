/**
 * Motor.gs \u2014 Motor de puntaje y validaci\u00f3n. JavaScript puro, sin dependencias de Apps Script
 * (se ejecuta igual en el servidor, en Node para pruebas y en el preview del navegador).
 *
 * Reproduce, motor por motor, las f\u00f3rmulas del libro "Modulo1_Tests_y_Matrices_OMR.xlsx":
 *   ESCALA_AREAS     \u2192 1. Rueda de la Vida      (promedio por \u00e1rea; \u00e1rea m\u00e1s baja / m\u00e1s alta)
 *   MARCAS_EXACTAS   \u2192 2. Test VAK              (20 marcas; conteo por canal; % = marcas \u00d7 5)
 *   ESCALA_FACTORES  \u2192 3. Factores Motivacionales (suma /30 por factor; desempate L > P > F)
 *   ELECCION_BINARIA \u2192 4. Metaprogramas         (A/B; puntos /8 por polo; empate = Equilibrado)
 *   SITUACIONAL      \u2192 5. Estilos de Liderazgo  (cuadrante por letra; adaptabilidad = \u03a3 puntos)
 *   ESCALA_DISCRETA  \u2192 6. Roles de Equipo       (1/3/6/9; 3 \u00edtems por rol; orientaci\u00f3n natural)
 *
 * Entrada `def`:  { evaluacion:{motor, escala, config}, dimensiones[], preguntas[{id_pregunta, dimension, opciones[]}], interpretaciones[] }
 * Entrada `resp`: { id_pregunta: valor }   (n\u00famero, "x"/1, "A"/"B" o "a".."d" seg\u00fan el motor)
 */
var Motor = (function () {
  'use strict';

  var MOTORES = ['ESCALA_AREAS', 'MARCAS_EXACTAS', 'ESCALA_FACTORES', 'ELECCION_BINARIA', 'SITUACIONAL', 'ESCALA_DISCRETA', 'MATRIZ'];

  // \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 utilidades \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
  function num(v) { var n = Number(v); return (v === null || v === undefined || v === '' || isNaN(n)) ? null : n; }
  function r4(n) { return Math.round(n * 10000) / 10000; }
  function suma(a) { return a.reduce(function (s, x) { return s + x; }, 0); }
  function porOrden(a) { return a.slice().sort(function (x, y) { return (x.orden || 0) - (y.orden || 0); }); }
  function pctTxt(p) { return Math.round(p * 100) + '%'; }
  function signo(n) { return n > 0 ? '+' + n : String(n); }

  function textoInterp(def, tipo, codigo) {
    var it = (def.interpretaciones || []).filter(function (i) { return i.tipo === tipo && i.codigo === codigo; })[0];
    return it ? it.texto : '';
  }
  function dimPorCodigo(def, codigo) {
    return def.dimensiones.filter(function (d) { return d.codigo === codigo; })[0];
  }
  /** Ordena por valor + desempate (descendente), tal como hacen las columnas auxiliares "+0.04\u2026" del libro. */
  function ranking(puntajes, def) {
    return puntajes.map(function (p) {
      var d = dimPorCodigo(def, p.codigo);
      return { p: p, clave: p.valor + ((d && d.desempate) || 0) };
    }).sort(function (a, b) { return b.clave - a.clave; }).map(function (x) { return x.p; });
  }
  function base(def) {
    return { motor: def.evaluacion.motor, completo: false, mensaje: '', puntajes: [], principal: '', secundario: '',
             claves: {}, extras: {}, filas: [], conclusion: '' };
  }
  function puntaje(d, valor, pct, n) { return { codigo: d.codigo, nombre: d.nombre, grupo: d.grupo || null, valor: r4(valor), pct: r4(pct), n: n }; }

  // \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 motores \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
  var HANDLERS = {

    /* 1 \u00b7 Rueda de la Vida \u2014 promedio por \u00e1rea; las no aplicables se dejan en blanco */
    ESCALA_AREAS: function (def, resp) {
      var r = base(def), esc = def.evaluacion.escala, vacias = 0;
      porOrden(def.dimensiones).forEach(function (d) {
        var vals = [];
        def.preguntas.forEach(function (q) {
          if (q.dimension !== d.codigo) return;
          var v = num(resp[q.id_pregunta]);
          if (v !== null && v >= esc.min && v <= esc.max) vals.push(v);
        });
        if (!vals.length) vacias++;
        var prom = vals.length ? suma(vals) / vals.length : 0;
        r.puntajes.push(puntaje(d, prom, prom / esc.max, vals.length));
      });
      r.completo = vacias === 0;
      if (!r.completo) { r.mensaje = 'Completa las ' + r.puntajes.length + ' \u00e1reas (responde al menos una afirmaci\u00f3n en cada una)'; return r; }
      var vals = r.puntajes.map(function (p) { return p.valor; });
      var general = suma(vals) / vals.length;
      var baja = r.puntajes[vals.indexOf(Math.min.apply(null, vals))];
      var alta = r.puntajes[vals.indexOf(Math.max.apply(null, vals))];
      r.principal = baja.nombre;                                   // "\u00c1rea m\u00e1s baja" (Mi Perfil!C6)
      r.claves = { mas_baja: baja.nombre, mas_alta: alta.nombre, promedio: r4(general) };
      r.filas = [{ titulo: 'Rueda de la Vida', resultado: baja.nombre + ' (\u00e1rea m\u00e1s baja)',
                   detalle: 'Promedio general: ' + general.toFixed(1) + ' \u00b7 \u00c1rea m\u00e1s alta: ' + alta.nombre }];
      r.conclusion = 'Tu promedio general es ' + general.toFixed(1) + ' sobre ' + esc.max + '. Tu \u00e1rea m\u00e1s baja es ' + baja.nombre +

  // \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 sesi\u00f3n \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500

  function sesion(token) {

  // \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 definiciones de evaluaci\u00f3n \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
  function cargarEval(id) {

  /** Carga la definici\u00f3n completa (con claves). Se cachea por id+versi\u00f3n: editar cualquier texto incrementa la versi\u00f3n. */
  function cargarDef(id) {
    var ev = cargarEval(id), ck = 'def2:' + id + ':' + ev.version, c = Db.cacheGet(ck);   // def2: v1.8.0 invalida cach\u00e9s previas a la reparaci\u00f3n de tildes
    if (c) return JSON.parse(c);
    var def = { evaluacion: Object.assign({}, ev, { escala: pj(ev.escala_json, {}), config: pj(ev.config_json, {}) }),
                dimensiones: [], preguntas: [], interpretaciones: [], columnas: [], fijas: [] };

  /** Versi\u00f3n para el cliente: sin dimensi\u00f3n/puntos (la clave de puntaje no sale del servidor). */

    });

  /** Convierte una definici\u00f3n (formato import) en filas de tablas. */
  function aplanar(d, estado, orden) {

      descripcion: d.descripcion || '', instruccion: d.instruccion || '', escala_json: JSON.stringify(d.escala || {}), config_json: JSON.stringify(d.config || {}),
      nota: d.nota || '', estado: estado, version: 1, publicada_en: estado === 'Publicada' ? t : '', actualizado_en: t });
    (d.dimensiones || []).forEach(function (x, i) {
      R.Dimensiones.push({ id_dimension: d.codigo + '-' + x.codigo, id_evaluacion: idEv, codigo: x.codigo, nombre: x.nombre, grupo: x.grupo || '',

    });

      (q.opciones || []).forEach(function (o) {
        R.Opciones.push({ id_opcion: idq + '-' + String(o.letra).toLowerCase(), id_pregunta: idq, letra: o.letra, texto: o.texto, dimension: o.dimension, puntos: o.puntos === undefined ? 0 : o.puntos });
      });
    });
    (d.interpretaciones || []).forEach(function (x, i) {
      R.Interpretaciones.push({ id_interpretacion: d.codigo + '-I' + pad(i + 1, 2), id_evaluacion: idEv, tipo: x.tipo, codigo: x.codigo,
        umbral_min: x.umbral_min === null || x.umbral_min === undefined ? '' : x.umbral_min, texto: x.texto });
    });
    (d.columnas || []).forEach(function (c, i) {
      R.Matrices_Columnas.push({ id_evaluacion: idEv, orden: c.orden || i + 1, clave: c.clave, etiqueta: c.etiqueta, tipo: c.tipo,
        opciones: c.opciones ? c.opciones.join('|') : '', autofuente: c.autofuente || '' });
    });

      R.Matrices_Filas_Fijas.push({ id_evaluacion: idEv, orden: f.orden || i + 1, valor: f.valor, referencia: f.referencia || '' });

  }
  function insertarDef(d, estado, orden) {

  }
  function visible(ev, u) { return ev.estado === 'Publicada' || (u.rol === 'Administrador' && ev.estado === 'Habilitada'); }

  // \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 resultados \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500

  }

  function perfil(idUsuario) {

    var vig = intentosVigentes(idUsuario), resultados = [], pendientes = [];
    evs.forEach(function (e) {
      var i = primero(vig, function (x) { return x.id_evaluacion === e.id_evaluacion; });

  }

  // \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 ACCIONES \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
  var ACCIONES = {

    // \u2014 acceso \u2014
    login: function (p) {
      var usuario = txt(p.usuario, 60).toLowerCase(), clave = String(p.clave || ''), kf = 'fail:' + usuario;
      if (parseInt(Db.cacheGet(kf) || '0', 10) >= MAX_INTENTOS_LOGIN) throw err('Demasiados intentos fallidos. Espera 15 minutos.', '429');
      var u = primero(T('Usuarios'), function (r) { return r.usuario === usuario; });
      var ok = u && u.estado === 'Activo' && hashClave(clave, u.clave_salt) === u.clave_hash;
      if (!ok) {
        Db.cachePut(kf, String(parseInt(Db.cacheGet(kf) || '0', 10) + 1), 900);
        log(null, 'LOGIN_FALLIDO', usuario);
        throw err(u && u.estado !== 'Activo' ? 'Tu cuenta est\u00e1 deshabilitada. Contacta a Talento Humano y Cultura.' : 'Usuario o clave incorrectos.', '401');
      }
      Db.cacheDel(kf);
      var token = Db.uuid() + Db.uuid();
      Db.cachePut('ses:' + token, JSON.stringify({ id_usuario: u.id_usuario }), TTL_SESION);
      Db.updateWhere('Usuarios', function (r) { return r.id_usuario === u.id_usuario; }, { ultimo_acceso: ahora() });
      sucio('Usuarios');
      return { token: token, usuario: seguro(u), catalogos: catalogos() };
    },
    logout: function (p, ctx) { Db.cacheDel('ses:' + ctx.token); return true; },
    sesion: function (p, ctx) { return { usuario: seguro(ctx.usuario), catalogos: catalogos() }; },
    cambiarClave: function (p, ctx) {
      var u = ctx.usuario;
      if (hashClave(String(p.actual || ''), u.clave_salt) !== u.clave_hash) throw err('La clave actual no es correcta');
      validarClave(String(p.nueva || ''), u.usuario);
      fijarClave(u, String(p.nueva), false);
      return true;
    },

    // \u2014 colaborador \u2014
    misEvaluaciones: function (p, ctx) {
      var id = ctx.usuario.id_usuario, vig = intentosVigentes(id), md = T('Matrices_Datos');
      return T('Evaluaciones').filter(function (e) { return visible(e, ctx.usuario); }).sort(function (a, b) { return a.orden - b.orden; }).map(function (e) {
        var o = { id_evaluacion: e.id_evaluacion, codigo: e.codigo, tipo: e.tipo, motor: e.motor, nombre: e.nombre, descripcion: e.descripcion, estado: e.estado };
        if (e.tipo === 'TEST') {
          var i = primero(vig, function (x) { return x.id_evaluacion === e.id_evaluacion; });
          o.hecho = !!i; if (i) { o.fecha = i.fecha; o.principal = i.principal; o.secundario = i.secundario; }
        } else {
          o.filas = md.filter(function (r) { return r.id_evaluacion === e.id_evaluacion && r.id_usuario === id && r.fila > 0; }).length;

    evaluacionDef: function (p, ctx) {

      return defPublica(cargarDef(p.id_evaluacion));
    },
    enviarRespuestas: function (p, ctx) {

      if (ev.tipo !== 'TEST' || !visible(ev, ctx.usuario)) throw err('Esta evaluaci\u00f3n no est\u00e1 disponible', '403');

            if (v in cuenta) cuenta[v]++;

        });
        if (e.motor === 'ESCALA_AREAS' && ints.length) {

          out.rueda = { n: ints.length, max: def.evaluacion.escala.max, areas: areas, general: areas.reduce(function (s, a) { return s + a.prom; }, 0) / areas.length };

          var bn = {}; def.interpretaciones.forEach(function (x) { if (x.tipo === 'BANDA') bn[x.codigo] = { cod: x.codigo, texto: x.texto, u: x.umbral_min }; });

        }

        }).filter(function (x) { return x.colaboradores > 0; });
      };
      out.porArea = agrupar('Areas', 'id_area', 'id_area', 'nombre');
      out.porSucursal = agrupar('Sucursales', 'id_sucursal', 'id_sucursal', 'nombre');

    /** v1.7.0 \u00b7 Elimina una sucursal o \u00e1rea. Si tiene usuarios asignados, se reasignan en la misma operaci\u00f3n a p.destino
     *  (otro registro del mismo cat\u00e1logo). \u00c1reas: destino '' = "Sin \u00e1rea". Sucursales: si hay colaboradores asignados el destino es
     *  obligatorio (un colaborador siempre debe tener sucursal). p.simular \u2192 solo impacto. Los resultados no guardan sucursal/\u00e1rea,
     *  por eso la anal\u00edtica hist\u00f3rica se recalcula con la nueva asignaci\u00f3n. */
    catalogoEliminar: function (p, ctx) {
      if (['Sucursales', 'Areas'].indexOf(p.tabla) < 0) throw err('Cat\u00e1logo inv\u00e1lido');
      var pk = ESQUEMA[p.tabla].pk, fk = pk, it = primero(T(p.tabla), function (r) { return r[pk] === p.id; });
      if (!it) throw err('El registro no existe');
      var asignados = T('Usuarios').filter(function (u) { return u[fk] === it[pk]; });
      var imp = { usuarios: asignados.length, colaboradores: asignados.filter(function (u) { return u.rol === 'Colaborador'; }).length };
      if (p.simular) return { nombre: it.nombre, impacto: imp };
      var destino = p.destino === undefined || p.destino === null ? null : String(p.destino), dest = null;
      if (imp.usuarios) {
        if (destino === null) throw err('Elige a d\u00f3nde mover los ' + imp.usuarios + ' usuarios asignados');
        if (destino === it[pk]) throw err('El destino debe ser otro registro');

/* \002500\002500\002500\002500\002500\002500\002500\002500\002500 base \002500\002500\002500\002500\002500\002500\002500\002500\002500 */

}

}

/* \002500\002500\002500\002500\002500\002500\002500\002500\002500 tarjetas de evaluaci\0000f3n \002500\002500\002500\002500\002500\002500\002500\002500\002500 */

/* \002500\002500\002500\002500\002500\002500\002500\002500\002500 flujo del test (pantalla completa) \002500\002500\002500\002500\002500\002500\002500\002500\002500 */
.flow { position: fixed; inset: 0; z-index: 50; background: var(--bg); display: flex; flex-direction: column; }

.iconbtn:hover { background: var(--surface-2); }
.prog { max-width: 760px; margin: 6px auto 0; display: grid; gap: 6px; }

.intro { display: grid; gap: 14px; }
.intro .lead { font-size: 17px; line-height: 1.55; }
.note { font-size: 13.5px; color: var(--ink-2); padding: 12px 14px; background: var(--surface-2); border-radius: var(--r-md); border: 1px solid var(--line-2); }

.opts { display: grid; gap: 10px; }

/* \002500\002500\002500\002500\002500\002500\002500\002500\002500 gr\0000e1ficos (HTML/SVG, sin librer\0000edas) \002500\002500\002500\002500\002500\002500\002500\002500\002500 */

.pw { position: relative; }
